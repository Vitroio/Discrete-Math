</h4>
<div class="para logical">
<div class="para">For any finite sets <span class="process-math">\(A\)</span> and <span class="process-math">\(B\text{,}\)</span>
</div>
<div class="displaymath process-math">
\begin{equation*}
\card{A \cup B} = \card{A} + \card{B} - \card{A \cap B}\text{.}
\end{equation*}
</div>
