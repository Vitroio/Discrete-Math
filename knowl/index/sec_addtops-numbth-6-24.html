<div class="para">Suppose <span class="process-math">\(ad \equiv bd \pmod n\text{.}\)</span> Then <span class="process-math">\(a \equiv b \pmod{\frac{n}{\gcd(d,n)}}\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#sec_addtops-numbth-6-24-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
