<article class="assemblage assemblage-like"><h4 class="heading"><span class="title">Implications are Disjunctions.</span></h4>
<div class="para logical">
<div class="displaymath process-math">
\begin{equation*}
P \imp Q \equiv \neg P \vee Q\text{.}
\end{equation*}
</div>
