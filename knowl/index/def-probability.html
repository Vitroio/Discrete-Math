</h4>
<div class="para">Suppose a random experiment has sample space <span class="process-math">\(S\text{.}\)</span> The <dfn class="terminology">probability</dfn> of an event <span class="process-math">\(E\)</span> is the number of outcomes in <span class="process-math">\(E\)</span> divided by the number of outcomes in <span class="process-math">\(S\text{.}\)</span> We write this as <span class="process-math">\(P(E) = \frac{\card{E}}{\card{S}}\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#def-probability-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
