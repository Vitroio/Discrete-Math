<article class="assemblage assemblage-like"><h4 class="heading"><span class="title">Euler’s Formula for Planar Graphs.</span></h4>
<div class="para logical">
<div class="para">For any connected planar graph with <span class="process-math">\(v\)</span> vertices, <span class="process-math">\(e\)</span> edges, and <span class="process-math">\(f\)</span> faces, we have</div>
<div class="displaymath process-math">
\begin{equation*}
v-e + f = 2\text{.}
\end{equation*}
</div>
