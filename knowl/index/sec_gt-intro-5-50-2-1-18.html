<article class="li"><h5 class="heading"><span class="title">Walk</span></h5>
<div class="para">A sequence of vertices such that consecutive vertices (in the sequence) are adjacent (in the graph). A walk in which no edge is repeated is called a <dfn class="terminology">trail</dfn>, and a trail in which no vertex is repeated (except possibly the first and last) is called a <dfn class="terminology">path</dfn>.<div class="autopermalink" data-description="Paragraph"><a href="#sec_gt-intro-5-50-2-1-18-8" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
