<article class="theorem theorem-like"><h3 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.7.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Hall’s Marriage Theorem.</span>
</h3>
<div class="para logical">
<div class="para">Let <span class="process-math">\(G\)</span> be a bipartite graph with sets <span class="process-math">\(A\)</span> and <span class="process-math">\(B\text{.}\)</span> Then <span class="process-math">\(G\)</span> has a matching of <span class="process-math">\(A\)</span> if and only if</div>
<div class="displaymath process-math">
\begin{equation*}
|N(S)| \ge |S|
\end{equation*}
</div>
<div class="para">for all <span class="process-math">\(S \subseteq A\text{.}\)</span>
</div>
