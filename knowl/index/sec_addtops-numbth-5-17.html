<article class="assemblage assemblage-like"><h4 class="heading"><span class="title">Congruence and Divisibility.</span></h4>
<div class="para logical">
<div class="para">For any integers <span class="process-math">\(a\text{,}\)</span> <span class="process-math">\(b\text{,}\)</span> and <span class="process-math">\(n\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
a \equiv b \pmod{n} \qquad \text{ if and only if }  \qquad n \mid (a-b)\text{.}
\end{equation*}
</div>
